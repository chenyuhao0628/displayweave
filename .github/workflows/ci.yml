name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "apple=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD || true)"
          echo "Changed files against $BASE_SHA:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -Eq '^(AndroidReceiver/|\.github/workflows/ci\.yml|tools/)'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -Eq '^(Mac/|Shared/|iOS/|Tests/|project\.yml|tools/|\.github/workflows/ci\.yml)'; then
            echo "apple=true" >> "$GITHUB_OUTPUT"
          else
            echo "apple=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - working-directory: AndroidReceiver
        run: ./gradlew --no-daemon test assembleDebug lintDebug

  mac-and-swift:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Ensure XcodeGen is installed
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: build/verify/mac/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-
      - run: xcodegen generate
      - name: Swift standalone policy tests
        run: ./tools/run-swift-self-tests.sh
      - name: macOS Debug build
        run: >-
          xcodebuild -project OpenSidecar.xcodeproj -scheme OpenSidecarMac
          -configuration Debug -derivedDataPath build/verify/mac
          CODE_SIGNING_ALLOWED=NO ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO build
      - name: iOS Simulator compatibility build
        run: >-
          xcodebuild -project OpenSidecar.xcodeproj -scheme OpenSidecariOS
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/verify/ios
          CODE_SIGNING_ALLOWED=NO build

  web-and-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/brand-requirements.txt
      - run: python -m pip install -r tools/brand-requirements.txt
      - run: python tools/test-apple-distribution.py
      - run: python tools/test-mac-signing.py
      - name: Workspace and documentation maintenance regressions
        run: |
          python tools/test-workspace-cleanup.py
          python tools/test-docs-check.py
          python tools/test-release-packaging.py
      - run: python tools/export-brand-assets.py --check
      - run: pnpm build
      - run: pnpm run check:docs
      - run: pnpm run check:release
      - run: git diff --check
